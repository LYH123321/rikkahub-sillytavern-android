name: Build APK

on:
  push:
    branches: [ master, mingli, huadeng ]
  workflow_dispatch:

jobs:
  build:
    # 老 fork MiaoWuNYA/rikkahub-plus 已归档，只在新仓库构建
    # 缓存优化重构: 移除原仓库限制, 允许 fork 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # 自动安装 Android SDK 命令行工具（fork 无原仓库 secrets 时也能构建）
      - name: Setup Android SDK
        run: |
          set -e
          ANDROID_HOME="$HOME/android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          TOOLS_ZIP="$HOME/cmdline-tools.zip"
          if [ ! -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "下载 Android 命令行工具..."
            curl -sL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$TOOLS_ZIP"
            unzip -q "$TOOLS_ZIP" -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            rm "$TOOLS_ZIP"
          fi
          # 接受所有许可
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "sdkmanager = $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
      # 提前把 NDK / CMake 装好并校验，避免 AGP 在 Gradle 任务内部隐式下载。
      # 内联实现，不使用复合 action（其 action.yml 硬编码了 ANDROID_HOME，覆盖上层设置）。
      - name: Install NDK & CMake
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          echo "SDK_ROOT = $SDK_ROOT"

          # 从 gradle.properties 读取 NDK/CMake 版本
          GP="${GITHUB_WORKSPACE:-$PWD}/gradle.properties"
          read_gp() {
            [ -f "$GP" ] || { echo ""; return; }
            sed -n "s/^[[:space:]]*$1[[:space:]]*=[[:space:]]*\([^[:space:]]*\).*/\1/p" "$GP" | tail -n 1
          }
          NDK_VERSION="$(read_gp rikkahub.ndkVersion)"
          CMAKE_VERSION="$(read_gp rikkahub.cmakeVersion)"
          echo "NDK_VERSION   = $NDK_VERSION"
          echo "CMAKE_VERSION = $CMAKE_VERSION"

          SDKMANAGER="$(command -v sdkmanager)"
          echo "sdkmanager = $SDKMANAGER"

          # 接受许可
          set +o pipefail
          yes 2>/dev/null | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /tmp/sdk-licenses.log 2>&1 || true
          set -o pipefail

          install_pkg() {
            pkg="$1"; dest="$2"; label="$3"
            if [ -f "$dest/source.properties" ]; then
              echo "[sdk] $label 已就绪：$dest"
              return 0
            fi
            n=1
            while [ "$n" -le 4 ]; do
              echo "[sdk] 第 $n/4 次安装 $label ($pkg)"
              rm -rf "$SDK_ROOT/.temp" "$SDK_ROOT/.downloadIntermediates" || true
              "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "$pkg" > /tmp/sdk-install.log 2>&1 || {
                echo "[sdk] $label 安装失败，重试"; n=$((n+1)); sleep 3; continue
              }
              if [ -f "$dest/source.properties" ]; then
                echo "[sdk] $label 安装成功"; return 0
              fi
              n=$((n+1))
            done
            echo "::error::$label 连续 4 次安装失败：$pkg"
            return 1
          }

          install_pkg "ndk;$NDK_VERSION" "$SDK_ROOT/ndk/$NDK_VERSION" "NDK $NDK_VERSION"
          install_pkg "cmake;$CMAKE_VERSION" "$SDK_ROOT/cmake/$CMAKE_VERSION" "CMake $CMAKE_VERSION"
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upgrade pip & setuptools
        run: pip install --upgrade pip setuptools wheel
      - name: Force full Python reinstall (auto-update all packages)
        run: rm -rf app/build/python $HOME/.gradle/caches/chaquopy*
      - name: Pre-install setuptools for build
        run: pip install --upgrade pip setuptools wheel 2>&1 | tail -3
      - name: Write signing config
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        run: |
            if [ -n "$KEY_BASE64" ] && [ -n "$SIGNING_CONFIG" ]; then
            echo "$KEY_BASE64" | base64 -d > app/app.key
            echo "$SIGNING_CONFIG" > local.properties
          else
            # 密钥未配置时回退 debug 签名
            cat > local.properties << 'EOF'
          storeFile=app.key
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF
          echo "debugSigning=true" >> local.properties
          fi
      - name: Build
        run: |
          chmod +x gradlew
          rm -rf app/build/python/  # 清理之前失败构建的脏缓存
          ./gradlew assembleRelease -x :web:buildWebUi --no-build-cache --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      # AGP 9 已移除 applicationVariants，无法在 Gradle 里改产物名，改在这里重命名。
      # 默认名 app-release.apk 不带版本号，分批下载时容易和旧版本混淆。
      # 命名保持英文，避免升级工具处理中文路径出错。
      - name: Rename APK
        run: |
          set -e
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "versionName=$V"
          for f in app/build/outputs/apk/release/*.apk; do
            [ -e "$f" ] || { echo "没有找到 APK，保持原样"; exit 0; }
            case "$f" in
              *"$V"*) echo "已是带版本号的名称：$f" ;;
              *) mv "$f" "app/build/outputs/apk/release/rikkahub-plus-${V}-arm64-v8a.apk"
                 echo "重命名为 rikkahub-plus-${V}-arm64-v8a.apk" ;;
            esac
          done
          ls -la app/build/outputs/apk/release/
      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rikkahub-plus-fresh
          path: app/build/outputs/apk/release/*.apk

